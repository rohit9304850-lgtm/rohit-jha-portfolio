<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects Management | Rohit Jha</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="projects.css">
</head>

<body>

    <div class="page">

        <header class="topbar">
            <div>
                <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
                <p class="eyebrow">CONTENT MANAGEMENT</p>
                <h1>Projects<span>.</span></h1>
                <p class="subtitle">Manage your portfolio projects.</p>
            </div>

            <button id="logoutBtn" class="logout-btn">Logout</button>
        </header>


        <section class="toolbar">
            <div>
                <h2>Your Projects</h2>
                <p id="projectTotal">Loading projects...</p>
            </div>

            <button id="addProjectBtn" class="primary-btn">
                + Add New Project
            </button>
        </section>


        <!-- PROJECT FORM -->
        <section id="projectFormSection" class="form-card hidden">

            <div class="form-heading">
                <div>
                    <p class="eyebrow">PROJECT DETAILS</p>
                    <h2 id="formTitle">Add New Project</h2>
                </div>

                <button type="button" id="closeFormBtn" class="close-btn">×</button>
            </div>

            <form id="projectForm">

                <input type="hidden" id="projectId">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="title">Project Title *</label>
                        <input type="text" id="title" required placeholder="e.g. SwarmIQ">
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <input type="text" id="category" placeholder="e.g. AI / Web Development">
                    </div>

                    <div class="form-group full-width">
                        <label for="description">Description *</label>
                        <textarea id="description" rows="4" required placeholder="Describe your project..."></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label for="technologies">Technologies</label>
                        <input type="text" id="technologies" placeholder="Next.js, TypeScript, FastAPI">
                        <small>Separate technologies with commas.</small>
                    </div>

                    <div class="form-group">
                        <label for="githubUrl">GitHub URL</label>
                        <input type="url" id="githubUrl" placeholder="https://github.com/...">
                    </div>

                    <div class="form-group">
                        <label for="liveUrl">Live Demo URL</label>
                        <input type="url" id="liveUrl" placeholder="https://...">
                    </div>

                    <div class="form-group full-width">
                        <label for="projectImage">Project Image</label>
                        <input type="file" id="projectImage" accept="image/*">
                        <small>Maximum image size: 5 MB.</small>

                        <img id="imagePreview" class="image-preview hidden" alt="Project preview">
                        <p id="imageStatus" class="status"></p>
                    </div>

                    <label class="featured-option">
                        <input type="checkbox" id="featured">
                        <span>Mark as Featured Project</span>
                    </label>

                </div>

                <div class="form-actions">
                    <p id="formStatus" class="status"></p>

                    <button type="submit" id="saveProjectBtn" class="primary-btn">
                        Save Project
                    </button>
                </div>

            </form>

        </section>


        <!-- PROJECT LIST -->
        <section class="project-section">

            <div id="projectList" class="project-grid">
                <p class="loading-text">Loading projects...</p>
            </div>

        </section>

    </div>

    <script src="projects.js"></script>

</body>
</html>
